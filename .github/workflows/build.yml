name: Build Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd "Drowsiness detection"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable
      run: |
        cd "Drowsiness detection"
        python build_exe.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DrowsinessDetector-Windows
        path: "Drowsiness detection/dist/DrowsinessDetector.exe"

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1

    - name: Install dependencies
      run: |
        cd "Drowsiness detection"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable
      run: |
        cd "Drowsiness detection"
        python3 build_exe.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DrowsinessDetector-Linux
        path: "Drowsiness detection/dist/DrowsinessDetector"

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Prepare Files for Release
      run: |
        ls -R ./artifacts
        mv ./artifacts/DrowsinessDetector-Windows/DrowsinessDetector.exe ./DrowsinessDetector.exe
        mv ./artifacts/DrowsinessDetector-Linux/DrowsinessDetector ./DrowsinessDetector-Linux-x86_64
        chmod +x ./DrowsinessDetector-Linux-x86_64

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./DrowsinessDetector.exe
          ./DrowsinessDetector-Linux-x86_64
        name: Latest Build
        tag_name: v1.0.${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
