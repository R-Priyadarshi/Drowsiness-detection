<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drowsiness Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.05), transparent 25%);
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            max-width: 1200px;
            width: 95%;
            padding: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Camera Feed */
        .video-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            transition: all 0.3s ease;
        }

        /* Dashboard Stats */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            margin-bottom: 8px;
        }
        
        h1 {
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 16px;
        }

        .card-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* Score Display */
        .score-value {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Eye Stats */
        .eye-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .eye-card {
            text-align: center;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px 8px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .eye-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .eye-val {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: monospace;
        }

        /* Danger State Animations */
        body.danger-state {
            animation: pulse-bg 1s infinite alternate;
        }

        body.danger-state .status-dot {
            background: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        body.danger-state .progress-bar-fill {
            background: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }
        
        body.danger-state .score-value {
            color: var(--danger);
        }

        @keyframes pulse-bg {
            0% { background-color: var(--bg-color); }
            100% { background-color: #2a0808; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Feed -->
        <div class="video-container">
            <img src="{{ url_for('video_feed') }}" alt="Camera Feed">
            <div class="status-overlay">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Active</span>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="header">
                <h1>Drowsiness Detector</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">AI-Powered Driver Safety System</p>
            </div>

            <!-- Score Card -->
            <div class="card">
                <div class="card-title">Drowsiness Score</div>
                <div class="score-value" id="score-val">0</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="score-bar"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.75rem; color: var(--text-muted);">
                    <span>0 (Awake)</span>
                    <span>30 (Alarm)</span>
                </div>
            </div>

            <!-- Eye Tracking Card -->
            <div class="card">
                <div class="card-title">Neural Network Confidence</div>
                <div class="eye-stats">
                    <div class="eye-card">
                        <div class="eye-label">Left Eye Closed</div>
                        <div class="eye-val" id="left-eye-val">0.00</div>
                    </div>
                    <div class="eye-card">
                        <div class="eye-label">Right Eye Closed</div>
                        <div class="eye-val" id="right-eye-val">0.00</div>
                    </div>
                </div>
            </div>
            
            <!-- System State Card -->
            <div class="card" style="margin-top: auto;">
                <div class="card-title">Current State</div>
                <div style="font-size: 1.2rem; font-weight: 600;" id="system-state">Open</div>
            </div>
        </div>
    </div>

    <script>
        const scoreVal = document.getElementById('score-val');
        const scoreBar = document.getElementById('score-bar');
        const leftEyeVal = document.getElementById('left-eye-val');
        const rightEyeVal = document.getElementById('right-eye-val');
        const systemState = document.getElementById('system-state');
        const statusText = document.getElementById('status-text');

        // Fetch status constantly
        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // Update Score
                    scoreVal.innerText = data.score;
                    
                    // Cap width at 100% (score 30 is max visually, though it can go higher)
                    let percentage = Math.min((data.score / 30) * 100, 100);
                    scoreBar.style.width = percentage + '%';

                    // Update Eyes
                    leftEyeVal.innerText = data.l_prob.toFixed(2);
                    rightEyeVal.innerText = data.r_prob.toFixed(2);

                    // Update State Text
                    systemState.innerText = data.state;
                    statusText.innerText = data.state;

                    // Trigger visual alarm if score > 30
                    if (data.score > 30) {
                        document.body.classList.add('danger-state');
                        statusText.innerText = 'DANGER: ASLEEP';
                    } else {
                        document.body.classList.remove('danger-state');
                    }
                })
                .catch(err => console.error('Error fetching status:', err));
        }, 150); // Fast 150ms updates for UI responsiveness
    </script>
</body>
</html>
